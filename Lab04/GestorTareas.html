<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas Universitarias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .tarea-completada { text-decoration: line-through; color: #6c757d; }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h1 class="h3 mb-0">Gestor de Tareas Universitarias</h1>
                    </div>
                    <div class="card-body">

                        <!-- Alertas dinámicas -->
                        <div id="alertas"></div>

                        <!-- Formulario de alta -->
                        <form id="task-form" class="mb-4" novalidate>
                            <div class="mb-2">
                                <input type="text" id="titulo" class="form-control"
                                       placeholder="Título de la tarea" autocomplete="off">
                            </div>
                            <div class="mb-2">
                                <input type="text" id="curso" class="form-control"
                                       placeholder="Curso" autocomplete="off">
                            </div>
                            <div class="mb-3">
                                <input type="date" id="fechaEntrega" class="form-control">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Agregar tarea</button>
                        </form>

                        <!-- Filtros -->
                        <div id="filtros" class="btn-group mb-3" role="group">
                            <button type="button" class="btn btn-outline-primary active" data-filter="todas">Todas</button>
                            <button type="button" class="btn btn-outline-primary" data-filter="pendientes">Pendientes</button>
                            <button type="button" class="btn btn-outline-primary" data-filter="completadas">Completadas</button>
                        </div>

                        <!-- Lista -->
                        <ul id="task-list" class="list-group"></ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
