<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" contetn="width=device-width, initial-scale=1.0">
        <title>Registro de estudiantes</title>
        <link rel ="Stylesheet" href="css/estilos.css">

    </head>
    <body>
        <form action="/registro" method= "POST" class="form-container">
            <fieldset> 
                <legend> Informaciòn personal </legend>
                <div class="form-group">
                    <label for="nombre" class="form-label">Nombre completo: </label> 
                    <input type ="text" id="nombre" name="nombre" class="form-input"
                    required placeholder="Apellidos y nombres">
                </div>
                <div class="form-group">
                    <label for="nacimiento" class="form-label"> Fecha de nacimiento: </label> 
                    <input type ="date" id="nacimiento" name="nacimiento" class="form-input"
                    required placeholder="dia/mes/año">
                </div>
                <div class="form-group">
                    <label for="carrera" class="form-label"> Carrera profesional: </label> 
                    <select id="carrera" name="carrera" class="form-input" required>
                        <option value="">---Selecciona tu carrera---</option>
                        <option value="sistemas">Ingenieria de Sistemas</option>
                        <option value="medicina">Medicina</option>
                        <option value="enfermeria">Enfermería</option>
                        <option value="electrónica">Ingeniería Electronica</option>
                        <option value="civil">Ingeniería Civil</option>
                        <option value="industrial">Ingeniería Industrial</option>
                        <option value="mecanica">Ingeniería Mecánica</option>
                        <option value="minas">Ingeniería de Minas</option>
                    </select>
                </div>
            </fieldset>

            <fieldset>
                <legend>Informacion de la cuenta </legend>
                <div class ="form-group">
                    <label for="cui" class="form-label"> Codigo del estudiante: </label> 
                    <input type ="text" id="cui" name="cui" class="form-input" pattern="[0-9]{8}"
                    required placeholder="numero de 8 digitos">                </div>
                <div class="form-group">
                    <!Correo institucional: >
                    <label for="email" class="form-label">Correo Institucional:</label>
                    <input type="email" id="email" name="email" class="form-input"
                    required placeholder="usuario@universidad.edu.pe">
                </div>
                <div class="form-group">
                    <! Contraseña: >
                    <label for="key" class="form-label"> Contraseña: </label> 
                    <input type ="password" id="key" name="key" class="form-input"
                    minlength="8" pattern="(?=.*[A-Z])(?=.*[0-9]).{8,}}"
                    required placeholder="Minimo 8 caracteres, 1 mayúscula y 1 número">   
                </div>
                <div class ="form-group">
                    <label for="turno" class="form-label"> Codigo del estudiante: </label> 
                    <input type ="turno" id="turno" name="turno" class="form-input"
                    required placeholder="numero de 8 digitos">   <! Turno: >
                </div>
                <div class ="form-group">
                    <! Aceptacion de terminos: >
                </div>
            </fieldset>

        </form>
    </body>
</html>
